<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jialil De Leon Andrada - Founder & Organization Leader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0284c7', // Modern Blue
                        secondary: '#f97316', // Vibrant Orange
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-start p-0 m-0 relative overflow-x-hidden">

    <!-- Vibrant Apple-style Mesh Background Gradients (Shows through the glass) -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-400 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
        <div class="absolute top-1/3 -right-20 w-96 h-96 bg-orange-400 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute -bottom-32 left-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <!-- Main Apple-Style Glass Container Card -->
    <div class="w-full max-w-md bg-white/25 backdrop-blur-2xl min-h-screen sm:min-h-[90vh] sm:my-6 sm:rounded-[2.5rem] sm:shadow-[0_8px_32px_0_rgba(31,38,135,0.2)] sm:border border-white/50 flex flex-col relative overflow-hidden z-10 ring-1 ring-white/30">

        <!-- Top Decorative Header Bar (Glass Glow) -->
        <div class="absolute top-0 left-0 right-0 h-36 bg-gradient-to-r from-primary/80 to-secondary/80 backdrop-blur-md opacity-90 rounded-b-[2.5rem] shadow-lg z-0 border-b border-white/20"></div>

        <!-- Hero / Profile Section -->
        <div class="relative z-10 flex flex-col items-center pt-12 px-6 text-center">
            <!-- Portrait / Avatar with Glass Border -->
            <div class="relative mb-4 group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-secondary to-primary rounded-full blur opacity-75 group-hover:opacity-100 transition duration-300"></div>
                <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-white/80 shadow-2xl bg-white/30 backdrop-blur-md flex items-center justify-center">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" 
                         alt="Jialil De Leon Andrada" 
                         class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Name & Title -->
            <h1 class="text-2xl font-bold tracking-tight text-white mb-1 drop-shadow-[0_2px_8px_rgba(0,0,0,0.3)]">Jialil De Leon Andrada</h1>
            <p class="text-secondary font-semibold text-xs tracking-wider uppercase mb-4 bg-white/40 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/60 inline-block shadow-sm">
                Founder & Organization Leader
            </p>
        </div>

        <!-- Contact Details Section (iOS Frosted Card) -->
        <div class="relative z-10 px-6 mt-2 mb-6">
            <div class="bg-white/30 backdrop-blur-xl rounded-2xl p-4 border border-white/50 shadow-[0_4px_20px_rgba(0,0,0,0.05)] space-y-3 ring-1 ring-white/20">
                <!-- Mobile Number -->
                <div class="flex items-center space-x-3 text-slate-800 text-sm">
                    <div class="w-9 h-9 rounded-xl bg-white/50 border border-white/60 text-primary flex items-center justify-center flex-shrink-0 shadow-sm">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <span class="font-medium tracking-wide">+63 900 000 0000</span>
                </div>
                <!-- Email Add -->
                <div class="flex items-center space-x-3 text-slate-800 text-sm">
                    <div class="w-9 h-9 rounded-xl bg-white/50 border border-white/60 text-secondary flex items-center justify-center flex-shrink-0 shadow-sm">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <span class="font-medium tracking-wide truncate">jialil@example.com</span>
                </div>
                <!-- Location -->
                <div class="flex items-center space-x-3 text-slate-800 text-sm">
                    <div class="w-9 h-9 rounded-xl bg-white/50 border border-white/60 text-primary flex items-center justify-center flex-shrink-0 shadow-sm">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <span class="font-medium tracking-wide">Bugallon, Pangasinan, Philippines</span>
                </div>
            </div>
        </div>

        <!-- Scroll Indicator Hint -->
        <div class="flex flex-col items-center justify-center mb-4 text-white/90 drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)] text-xs animate-bounce z-10 font-medium">
            <span>Scroll for actions</span>
            <i class="fa-solid fa-chevron-down mt-1"></i>
        </div>

        <!-- Actions Section (Translucent Bottom Glass Drawer) -->
        <div class="flex-1 bg-white/20 backdrop-blur-2xl rounded-t-[2.5rem] p-6 border-t border-white/50 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] space-y-6 relative z-10 ring-1 ring-white/20">
            
            <!-- Quick Actions Group -->
            <div>
                <h2 class="text-xs font-bold text-slate-600 uppercase tracking-widest mb-3 px-1">Quick Actions</h2>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Save Contact (.vcf download) -->
                    <button onclick="saveContact()" class="flex items-center justify-center space-x-2 bg-gradient-to-r from-primary to-sky-600 hover:brightness-110 text-white font-medium py-3 px-4 rounded-2xl shadow-lg shadow-sky-500/20 transition-all transform active:scale-95 text-sm border border-white/30">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Save Contact</span>
                    </button>
                    <!-- Call -->
                    <button onclick="triggerAction('tel:+639000000000')" class="flex items-center justify-center space-x-2 bg-white/40 hover:bg-white/60 text-slate-800 font-medium py-3 px-4 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 text-sm">
                        <i class="fa-solid fa-phone text-primary"></i>
                        <span>Call</span>
                    </button>
                    <!-- Text / SMS -->
                    <button onclick="triggerAction('sms:+639000000000')" class="flex items-center justify-center space-x-2 bg-white/40 hover:bg-white/60 text-slate-800 font-medium py-3 px-4 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 text-sm">
                        <i class="fa-solid fa-comment-sms text-secondary"></i>
                        <span>Text / SMS</span>
                    </button>
                    <!-- Send Email -->
                    <button onclick="triggerAction('mailto:jialil@example.com')" class="flex items-center justify-center space-x-2 bg-white/40 hover:bg-white/60 text-slate-800 font-medium py-3 px-4 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 text-sm">
                        <i class="fa-solid fa-paper-plane text-primary"></i>
                        <span>Email</span>
                    </button>
                    <!-- Messenger -->
                    <button onclick="triggerAction('https://m.me/yourusername')" class="flex items-center justify-center space-x-2 bg-white/40 hover:bg-white/60 text-slate-800 font-medium py-3 px-4 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 text-sm">
                        <i class="fa-brands fa-facebook-messenger text-sky-500"></i>
                        <span>Messenger</span>
                    </button>
                    <!-- Google Maps -->
                    <button onclick="triggerAction('https://maps.google.com/?q=Bugallon+Pangasinan')" class="flex items-center justify-center space-x-2 bg-white/40 hover:bg-white/60 text-slate-800 font-medium py-3 px-4 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 text-sm">
                        <i class="fa-solid fa-map-location-dot text-secondary"></i>
                        <span>Maps</span>
                    </button>
                </div>
            </div>

            <!-- Social Media & Links Group -->
            <div>
                <h2 class="text-xs font-bold text-slate-600 uppercase tracking-widest mb-3 px-1">Connect Online</h2>
                <div class="space-y-3">
                    <!-- Facebook Page -->
                    <button onclick="triggerAction('https://facebook.com/yourpage')" class="w-full flex items-center justify-between bg-white/40 hover:bg-white/60 p-3.5 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 group">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-white/60 border border-white/80 text-blue-600 flex items-center justify-center text-lg shadow-sm">
                                <i class="fa-brands fa-facebook-f"></i>
                            </div>
                            <span class="font-medium text-slate-800 text-sm">Facebook Page</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-slate-800 transition-colors text-xs"></i>
                    </button>

                    <!-- Website Link -->
                    <button onclick="triggerAction('https://yourwebsite.com')" class="w-full flex items-center justify-between bg-white/40 hover:bg-white/60 p-3.5 rounded-2xl border border-white/60 backdrop-blur-md shadow-sm transition-all transform active:scale-95 group">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-white/60 border border-white/80 text-secondary flex items-center justify-center text-lg shadow-sm">
                                <i class="fa-solid fa-globe"></i>
                            </div>
                            <span class="font-medium text-slate-800 text-sm">Official Website</span>
                        </div>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-slate-800 transition-colors text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Footer Branding -->
            <div class="pt-2 pb-4 text-center">
                <p class="text-xs text-slate-600 font-medium">Digital NFC Business Card &bull; Powered by Modern Web</p>
            </div>

        </div>

    </div>

    <!-- JavaScript for Handling Automatic Redirection and vCard Generation -->
    <script>
        function triggerAction(url) {
            setTimeout(() => {
                window.location.href = url;
            }, 100);
        }

        function saveContact() {
            const vCardData = 
`BEGIN:VCARD
VERSION:3.0
FN:Jialil De Leon Andrada
N:Andrada;Jialil;De Leon;;
TITLE:Founder & Organization Leader
TEL;TYPE=CELL:+639000000000
EMAIL:jialil@example.com
ADR:;;Bugallon, Pangasinan;;;;Philippines
URL:https://yourwebsite.com
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Jialil_De_Leon_Andrada.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
